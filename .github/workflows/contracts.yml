name: Contracts

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/contracts/**"
      - "packages/event-store/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/bootstrap-lockfile.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/contracts/**"
      - "packages/event-store/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile when absent
        if: hashFiles('pnpm-lock.yaml') == ''
        run: pnpm install --lockfile-only

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Verify typecheck and tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Finalize reproducible CI on sprint branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/contracts.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
          text = text.replace('          node-version: 22\n\n      - name: Generate lockfile when absent\n        if: hashFiles(\'pnpm-lock.yaml\') == \'\'\n        run: pnpm install --lockfile-only\n\n      - name: Verify frozen installation', '          node-version: 22\n          cache: pnpm\n\n      - name: Verify frozen installation')
          marker = '\n      - name: Finalize reproducible CI on sprint branch\n'
          text = text.split(marker, 1)[0] + '\n'
          path.write_text(text)
          PY
          rm -f .github/workflows/bootstrap-lockfile.yml
          if git diff --quiet -- pnpm-lock.yaml .github/workflows/contracts.yml .github/workflows/bootstrap-lockfile.yml; then
            echo "Reproducibility artifacts already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml .github/workflows/contracts.yml
          if [ -e .github/workflows/bootstrap-lockfile.yml ]; then
            git add -- .github/workflows/bootstrap-lockfile.yml
          else
            git add -u -- .github/workflows/bootstrap-lockfile.yml
          fi
          git commit -m "build: lock dependencies and enforce frozen CI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
