name: Contracts

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/contracts/**"
      - "packages/event-store/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/contracts/**"
      - "packages/event-store/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate authentic lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Verify typecheck and tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Commit repaired lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "build: repair pnpm lockfile from verified resolution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
